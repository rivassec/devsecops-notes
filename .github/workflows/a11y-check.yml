name: Accessibility check (pa11y)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pa11y:
    name: pa11y-ci against built site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --depth=1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Pelican
        # Same logic as deploy.yml: --require-hashes --no-deps because we
        # override Pygments past Pelican's pin.
        run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Build site
        # SITEURL points at the local server: publishconf's absolute
        # https://rivassec.com URLs made pa11y load the LIVE stylesheet, so a
        # PR's CSS change was never what got tested (found 2026-10-23).
        run: pelican content -o output -s publishconf.py -e 'SITEURL="http://127.0.0.1:8000"'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pa11y-ci
        # pa11y-ci 5 (pa11y 10, axe 4.13) for levelCapWhenNeedsReview: pa11y 6
        # reported axe "incomplete" (needs review) results as errors.
        run: npm install --global pa11y-ci@5.0.0

      - name: Serve built site
        run: |
          cd output
          python3 -m http.server 8000 &
          # Wait for the server to come up
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "server up"
              break
            fi
            sleep 0.5
          done

      - name: Run pa11y-ci
        # Still non-blocking. The 2026-06-12 contrast "errors" were axe
        # needs-review results (the hero gradient overlay hides the
        # background; measured worst case is 5.5:1, above AA), which pa11y 6
        # reported as errors. levelCapWhenNeedsReview now keeps them as
        # warnings. Every page in the sitemap is scanned. Flip to blocking
        # in its own PR once the run is clean.
        continue-on-error: true
        run: >-
          pa11y-ci --config .pa11yci.json
          --sitemap http://127.0.0.1:8000/sitemap.xml
          --sitemap-exclude '\.(txt|md|xml)$'
