name: Canonical / noindex guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: build then scan output for canonical/noindex contradictions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Initialize submodules
        run: git submodule update --init --depth=1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # Same logic as deploy.yml: --require-hashes --no-deps because we
        # override Pygments past Pelican's pin; every transitive dep is
        # already pinned with hashes in requirements.txt.
        run: pip install --require-hashes --no-deps -r requirements.txt

      - name: Build site and scan for canonical/noindex contradictions
        # The script builds with the same command deploy.yml uses
        # (pelican content -o output -s publishconf.py) then scans output/.
        run: scripts/check_canonical_noindex.py
