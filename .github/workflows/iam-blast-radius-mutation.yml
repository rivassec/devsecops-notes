name: IAM Blast Radius Mutation (nightly)

# IAM-604: Stryker mutation testing over the deterministic engine
# (evaluator / rules / escalation / correlate). Mutation testing is SLOW, so it
# runs NIGHTLY and is intentionally NOT wired into the PR-blocking CI
# (iam-blast-radius-ci.yml). A surviving mutant means the fixture corpus has a
# coverage gap to close (add a fixture or a sharper assertion), not that the tool
# is broken. This workflow never gates a pull request; it only reports the
# mutation score on a schedule (and on manual dispatch).

on:
  schedule:
    # 07:17 UTC nightly. Off-peak; the exact minute avoids the top-of-hour rush.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/iam-blast-radius

jobs:
  mutation:
    name: Stryker mutation score (engine)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dev dependencies (Stryker; CI-only, not shipped)
        run: npm install --no-audit --no-fund

      - name: Run mutation testing (nightly signal; break threshold enforced here only)
        run: npm run mutation
