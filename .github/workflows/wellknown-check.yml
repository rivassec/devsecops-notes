name: Well-known / llms guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: build then validate security.txt + llms files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Initialize submodules
        run: git submodule update --init --depth=1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --require-hashes --no-deps -r requirements.txt
      - name: Build site and validate security.txt + llms files
        run: scripts/check_wellknown_llms.py
