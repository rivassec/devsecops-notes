# Pre-commit hooks for rivassec/devsecops-notes.
# Install once with: pre-commit install
# Run manually with:  pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (staged secrets)
        # gitleaks v8.x renamed `protect` to `git --pre-commit`.
        # The upstream hook entry is now
        # `gitleaks git --pre-commit --redact --staged --verbose`
        # which is what we get by not overriding args here.

  - repo: local
    hooks:
      - id: no-em-dashes
        name: no em dashes in markdown
        entry: scripts/check_em_dashes.py
        language: python
        types: [markdown]
        # Pre-commit passes only the staged files matching `types`,
        # so the script's "if argv: scan those" path takes over.
        # No additional args needed.

      - id: paradigm-shift-warn
        name: warn on antithesis / paradigm-shift sentences
        entry: scripts/check_paradigm_shift.py
        language: python
        types: [markdown]
        # The script always exits 0 — output is informational, never blocking.
        verbose: true

      - id: check-descriptions
        name: enforce article Summary length + uniqueness
        entry: scripts/check_descriptions.py
        language: python
        types: [markdown]
        files: ^content/[^/]+\.md$
        # Only fails when explicit staged files violate (100-160 chars,
        # non-empty, unique). Repo-wide scans warn but do not fail. See
        # scripts/check_descriptions.py header comment for policy.

      - id: check-requirements-clean
        name: block index URLs / credentials in requirements files
        entry: scripts/check_requirements_clean.py
        language: python
        files: ^requirements.*\.txt$
        # pip-compile inlines the machine's pip.conf index URLs (incl.
        # embedded PATs) into its output. Regenerate with `make deps`
        # (PIP_CONFIG_FILE=/dev/null) if this fires.
