<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ SITEURL }}/#website",
      "name": "{{ SITENAME }}",
      "url": "{{ SITEURL }}",
      "inLanguage": "en-US",
      "description": "{{ SITEDESCRIPTION }}",
      "image": "{% if OG_IMAGE %}{{ SITEURL }}/{{ OG_IMAGE }}{% else %}{{ SITEURL }}/{{ SITELOGO }}{% endif %}",
      "publisher": {"@id": "{{ SITEURL }}/#organization"},
      "author": {
        "@type": "Person",
        "@id": "{{ SITEURL }}/#person",
        "name": "Oliver Rivas",
        "url": "{{ SITEURL }}",
        "sameAs": ["https://github.com/rivassec"],
        "jobTitle": "Security Engineer",
        "knowsAbout": ["DevSecOps", "Kubernetes security", "AWS IAM", "AI security", "OSINT"]
      }
    },
    {
      "@type": "Organization",
      "@id": "{{ SITEURL }}/#organization",
      "name": "{{ SITENAME }}",
      "url": "{{ SITEURL }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ SITEURL }}/{{ SITELOGO }}"
      }
    }
  ]
}
</script>
